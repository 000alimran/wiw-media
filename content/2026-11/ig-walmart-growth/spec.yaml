title: "Walmart's growth isn't in the aisles"
hashtags: [Walmart, RetailMedia, Advertising, Ecommerce, Business, Investing]
caption:
  long: |
    Walmart's total revenue grew 5.2% last quarter, to $188.8B.

    The fast growth is elsewhere: U.S. ads +37%, U.S. online +23%, membership fees +17%. Online is now about 24% of sales.

    The world's biggest store is quietly becoming an ad and subscription business.
  short: "Walmart's ads grew 37%. Its total revenue grew 5.2%."
