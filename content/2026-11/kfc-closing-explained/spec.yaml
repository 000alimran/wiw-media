caption:
  long: |
    KFC restaurants are closing across America, but KFC itself isn't bankrupt. A franchisee is.

    Tasty Chick'n ran 75 KFCs plus 9 KFC/Taco Bell restaurants in 10 states. It largely stopped paying royalties to Yum Brands in November 2025 and owed about $15.7M when it filed for Chapter 11 on Nov 16, 2026. In Puerto Rico, about 80 KFCs closed temporarily after Yum ended its deal with another operator.

    Zoom out: KFC closed 161 US restaurants in 2025 while adding 2,971 internationally.

    For education only, not financial advice.
  short: "KFC isn't going bankrupt. A franchisee is. And KFC is opening thousands of stores overseas."
