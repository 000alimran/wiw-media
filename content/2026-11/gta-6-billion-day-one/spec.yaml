cover: {line1: "$1.84B", line2: "BY DAY ONE", line3: "GTA 6 · Sensor Tower est.", tone: good}
caption:
  long: |
    GTA 6 launched on Nov 19, 2026, and Sensor Tower estimates it brought in about $1.84 billion and roughly 19 million copies by release day.

    GTA 5 took three days to reach $1 billion in 2013. Avengers: Endgame's record global opening weekend was about $1.2 billion.

    About 75% of sales came from PlayStation. The catch: so many copies were pre-ordered that sales could slow faster from here.

    Estimates, not official Take-Two figures. For education only, not financial advice.
  short: "GTA 6 made an estimated $1.84B by release day. That beats Endgame's opening weekend."
