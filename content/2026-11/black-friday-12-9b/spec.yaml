caption:
  long: |
    Adobe forecasts $12.9 billion in U.S. online spending this Black Friday, up 9.2%. Cyber Monday is still the biggest day at $15.1 billion, and Thanksgiving adds $6.9 billion.

    Black Friday is growing faster because deals are landing earlier. Adobe expects the best prices on TVs, toys, apparel and appliances on Black Friday, and on electronics and computers on Cyber Monday.

    About $807 million of Black Friday spending is expected to go through buy now, pay later.
  short: "$12.9 billion online in one day. Here's when the real deals land."
