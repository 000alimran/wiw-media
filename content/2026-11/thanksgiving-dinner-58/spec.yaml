cover: {line1: "$58.63", line2: "FOR DINNER", line3: "Thanksgiving 2026", tone: bad}
caption:
  long: |
    The American Farm Bureau's 2026 survey puts a classic Thanksgiving dinner for 10 at $58.63, up 6% from last year and the first increase since 2022.

    The biggest driver is the turkey: a 16-pound bird averages $23.68, up from $21.50. Higher diesel costs make it pricier to move food from farm to table.

    It is still below the 2022 record of $64.05, about $5.86 per person.
  short: "Thanksgiving dinner for 10 now costs $58.63. The turkey is the reason."
