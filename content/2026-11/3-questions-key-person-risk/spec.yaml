caption:
  long: 'Three questions to ask about any company you invest in, or work for, from Nvidia''s 11-day CEO crisis:

    1. If the founder vanished, who would the biggest customers call?

    2. Is there a real succession plan?

    3. Who can say no to the CEO?


    Full breakdown: {LONG_URL}


    For education only, not financial advice.'
