  long: |
    Adobe expects a record $21.3 billion in buy now, pay later spending this holiday season, $1.3 billion more than last year.

    Last Cyber Monday, BNPL passed $1 billion in a single day for the first time. About 82% of BNPL spending happens on a phone.

    Split payments feel small. Add up every plan before you tap.
