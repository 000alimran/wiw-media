title: "SpaceX Doesn't Make Its Money From Rockets"
source: "Sources: SpaceX S-1 via CNBC, Tomasz Tunguz, Morningstar, Yahoo Finance · Not financial advice"
hashtags: [SpaceX, Starlink, IPO, ElonMusk, BusinessBreakdown, Investing]
cover: {line1: "61%", line2: "NOT ROCKETS", line3: "SpaceX S-1", tone: good}
caption:
  long: |
    SpaceX doesn't make most of its money from rockets.

    In 2025, Starlink brought in about $11.4B, around 61% of SpaceX's revenue, at a roughly 39% operating margin. The launch business and the AI unit both ran operating losses.

    Starlink subscribers grew from 2.3M in 2023 to 8.9M in 2025. The internet business is funding the rockets and the AI.

    Source: SpaceX S-1, via CNBC, Tomasz Tunguz and Morningstar. For education only, not financial advice.
  short: "SpaceX's money doesn't come from rockets. 61% comes from Starlink. Not financial advice."
