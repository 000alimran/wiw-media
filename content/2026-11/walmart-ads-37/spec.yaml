cover: {line1: "+37%", line2: "WALMART ADS", line3: "Q3 FY2027", tone: good}
caption:
  long: |
    Walmart made $188.8 billion in revenue last quarter, up 5.2%. But the fastest growth was elsewhere: U.S. advertising up 37%, U.S. e-commerce up 23%, membership fees up 17%.

    Online is now about 24% of Walmart's sales. Brands pay to show up where millions of shoppers already search and buy.
  short: "Walmart's U.S. ad business grew 37%. Groceries grew a lot slower."
