caption:
  long: |
    Abercrombie & Fitch stock jumped about 22% to $172.15 after a record third quarter: $1.4 billion in sales, up 11%, its 16th straight quarter of growth.

    Operating margin hit 15.5%, above guidance, and EPS rose 62% to $3.82. Both Abercrombie (+12%) and Hollister (+11%) grew.

    The 52-week low was $69.68, so the stock is now about 2.5x off that low (our math).
  short: "Abercrombie just had its 16th straight growth quarter. The stock jumped 22% in a day."
