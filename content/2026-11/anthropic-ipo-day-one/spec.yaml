caption:
  long: |
    Anthropic priced its IPO at $83 a share, the biggest IPO on record. The stock opened at $111.50, up 34%, briefly valuing the company at about $2.1 trillion.

    By the close it was $97.17, still up 17% from the IPO price. First-half 2026 revenue was $16.3 billion, per the prospectus.

    Analysts warned that buying hot IPOs on day one has historically lagged the market over three years.
  short: "Anthropic opened at $2.1 trillion. Here's where it closed on day one."
