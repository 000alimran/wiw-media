cover: {line1: "$209.40", line2: "EVERY MONTH", line3: "Medicare Part B 2027", tone: bad}
caption:
  long: |
    Medicare Part B will cost $209.40 a month in 2027, up $6.50 (3.2%) from $202.90, CMS announced Nov 17. The annual Part B deductible rises to $292.

    The good news: Social Security's 2027 COLA is 3.6%, so for the first time since 2023 the Part B increase is smaller than the raise. Last year the premium jumped $17.90 against a 2.8% COLA.

    Example (our math): on a $2,000 check, a 3.6% COLA adds $72. Minus the $6.50 premium increase, you keep about $65.50. Higher earners pay more through IRMAA.

    For education only, not financial or medical advice.
  short: "Medicare Part B hits $209.40/month in 2027. Here's how much of your raise you keep."
