caption:
  long: 'Nvidia made $115.8 billion in three months, up 103% from a year ago.


    $107.6B of it came from data centers, roughly 93% of the total (our math). Gaming, PCs, cars and robots combined: $8.2B.


    Gross margin was 74.8%. Next quarter''s guidance: $130B, assuming no China data center compute revenue.


    Source: NVIDIA Q3 FY2027 results. For education only, not financial advice.

    '
  short: Nvidia made $115.8B in 3 months. 93% came from one business. Not financial advice.
