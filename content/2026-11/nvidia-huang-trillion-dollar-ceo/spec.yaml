cover: {line1: "≈ $1 TRILLION", line2: "IN ONE DAY", line3: "Nvidia · Nov 23, 2026", tone: good}
caption:
  long: |
    Nvidia added close to $1 trillion in market value in a single day after its board reinstated Jensen Huang as CEO. Depending on the timestamp, estimates run from about $888B to $1T, the biggest one-day value gain on record (the previous record was roughly $450B).

    Timeline: Huang resigned on Nov 12 amid reports he was the target of a foreign intelligence effort. Last week the board said it did not intend to reinstate him. On Nov 23 it reversed, unanimously, after input from senior levels of the US government. The board's independent investigation continues.

    The lesson investors call key-person risk: when one leader is worth this much to a company, that's a strength and a risk at the same time.

    For education only, not financial advice.
  short: "Nvidia gained ~$1T in a day because one man came back. That's key-person risk. Not financial advice."
