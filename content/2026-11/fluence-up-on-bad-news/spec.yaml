caption:
  long: |
    Fluence Energy, which builds battery storage systems for power grids, reported revenue down 30% to $700 million and a $137.8 million net loss, after a profit a year earlier.

    The stock still jumped 21%. The reason: more than $6.2 billion in new orders. Markets price what's coming, not just what just happened.
  short: "Sales fell 30%. The stock jumped 21%. One number explains it."
