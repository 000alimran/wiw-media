caption:
  long: |
    Anduril, the defense-tech company co-founded by Oculus creator Palmer Luckey, went from a $30.5B valuation in June 2025 to $61B in May 2026 after a $5B raise.

    Revenue more than doubled to $2.2B in 2025. Reports in March said it expected about $4.3B in 2026, with an operating loss of around $1.2B.

    Investors are paying roughly 28x last year's revenue (our math), a bet on rising defense budgets and autonomous weapons.

    For education only, not financial advice.
  short: "Anduril went from $30.5B to $61B in 11 months. Here's what investors are betting on."
