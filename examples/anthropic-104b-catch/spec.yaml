caption:
  long: |
    Anthropic lost $104 billion in 9 months. Wall Street still handed it $81 billion.

    Here's the catch: $94.3B of that loss is a fair-value change on convertible notes and SAFEs. An accounting rule, not cash leaving the company.

    Not a money printer. Not a bonfire. Roughly break-even, while growing fast.

    Source: Anthropic S-1/A. For education only, not financial advice.
  short: "Anthropic lost $104B in 9 months... but $94.3B of it is paper. Not financial advice."
