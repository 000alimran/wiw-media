name: produce
# Renders every new video in content/<YYYY-MM>/<slug>/ and publishes it through HighLevel.
on:
  push:
    branches: [main]
    paths: ["content/**/spec.yaml", "content/**/voice.mp3"]
  workflow_dispatch:
    inputs:
      folder: {description: "content/<YYYY-MM>/<slug> (empty = all unpublished)", required: false}
concurrency: {group: produce, cancel-in-progress: false}
permissions: {contents: write}
jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install -q playwright pyyaml numpy requests scipy
          python -m playwright install --with-deps chromium >/dev/null
          mkdir -p ~/.fonts && cd ~/.fonts
          B=https://raw.githubusercontent.com/google/fonts/main/ofl
          curl -sLO "$B/anton/Anton-Regular.ttf"
          curl -sL -o Inter.ttf "$B/inter/Inter%5Bopsz,wght%5D.ttf"
          curl -sL -o Gelasio.ttf "$B/gelasio/Gelasio%5Bwght%5D.ttf"
          curl -sL -o DMSans.ttf "$B/dmsans/DMSans%5Bopsz,wght%5D.ttf"
          curl -sLO "$B/archivoblack/ArchivoBlack-Regular.ttf"
          fc-cache -f >/dev/null
      - name: Find videos to produce
        id: find
        run: |
          if [ -n "${{ inputs.folder }}" ]; then echo "list=${{ inputs.folder }}" >> $GITHUB_OUTPUT; exit 0; fi
          L=""
          for d in content/*/*/; do d=${d%/}
            [ -f "$d/spec.yaml" ] && [ ! -f "$d/state.json" ] && L="$L $d"
          done
          echo "list=$L" >> $GITHUB_OUTPUT
      - name: Voice, build, render, publish
        env:
          GHL_TOKEN: ${{ secrets.GHL_TOKEN }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          for d in ${{ steps.find.outputs.list }}; do
            echo "::group::$d"
            if [ ! -f "$d/voice.mp3" ]; then
              if [ -n "$ELEVENLABS_API_KEY" ]; then python tools/voice.py "$d" --tts || { echo "voice skipped"; continue; }; else python tools/voice.py "$d"; echo "no voice.mp3 yet - skipped"; continue; fi
            fi
            python tools/build.py "$d"
            python tools/render.py "$d"
            mode=$(python -c "import yaml;print(yaml.safe_load(open('$d/spec.yaml')).get('publish','review'))")
            if [ "$mode" != "review" ] && [ -n "$GHL_TOKEN" ]; then python tools/ghl.py publish "$d"; else echo "review mode: not published"; fi
            echo "::endgroup::"
          done
      - name: Keep videos for review (14 days)
        uses: actions/upload-artifact@v4
        with:
          name: videos
          path: |
            content/**/video.mp4
            content/**/cover.jpg
          retention-days: 14
          if-no-files-found: ignore
      - name: Save state
        run: |
          git config user.name "wiw-bot"; git config user.email "wiw-bot@users.noreply.github.com"
          git add content/**/state.json content/**/timing.json content/**/script.txt 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "produce: update state [skip ci]" && git push)
